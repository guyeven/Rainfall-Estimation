name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Compute-Link-Attenuations/requirements-lock.txt
      - name: Install the maintained pipeline
        run: python -m pip install -r Compute-Link-Attenuations/requirements-lock.txt
      - name: Repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Regression tests
        run: |
          python -m unittest discover -s Compute-Link-Attenuations/tests -v
          python -m unittest discover -s Patch-Generator/backend/tests -v
      - name: Compile Python sources
        run: >-
          python -m compileall -q Compute-Link-Attenuations Patch-Generator/backend
          Link-Generator/backend Links-4TU-NL ITU-Calculator/Python-React/backend

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - Patch-Generator/frontend
          - Link-Generator/frontend
          - Links-4TU-NL/patch-map-frontend
          - ITU-Calculator/Python-React/frontend
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
