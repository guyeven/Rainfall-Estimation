input:
  est_dir: "est_dir"
  file_pattern: "est_input_*.json"
  recursive: false

solvers:
  opt_ildw_constr_al:
    name: "opt_ildw_constr_al"
    label: "OPT_ILDW_CONSTR_AL"
    type: "custom"
    module: "solve_rain_constrained_al"
    out_dir: "sol_dir_opt_ildw_constr_al"

    optimization:
      maxiter: 300
      R0_from_ILDW: true
      R0_from_IDW: false

    tolerances:
      ftol: 1.0e-08
      gtol: 1.0e-07
      maxls: 20

    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

    augmented_lagrangian:
      constraint_ratio: 0.1
      constraint_tol: 1.0e-08
      outer_maxiter: 12
      rho_init: 10.0
      rho_growth: 2.0
      rho_max: 1.0e+10
      min_progress_ratio: 0.95
      weight_floor: 1.0e-12
      scale_1d: 1.0
      scale_2d: 1.0
      scale_total: 1.0
      enforce_feasible_output: true
      fail_on_infeasible: true
