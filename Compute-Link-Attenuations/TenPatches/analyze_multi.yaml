# ============================================================
# analyze_multi.yaml (DICT-style solvers; paths relative to this YAML)
# ============================================================

input:
  # Ground truth directory
  gt_dir: "gt_dir"
  gt_prefix: "gt"

  # Directory containing est_input_*.json (needed for link geometry & distances)
  est_input_dir: "est_dir"

  # Multiple solver output folders (each should contain est_input_*_solution.npz)
  solvers:
    opt_idw:
      name: "opt_idw"
      label: "OPT_IDW"
      sol_dir: "sol_dir_opt_idw"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

    opt_ildw:
      name: "opt_ildw"
      label: "OPT_ILDW"
      sol_dir: "sol_dir_opt_ildw"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

    opt_0p1:
      name: "opt_0p1"
      label: "OPT_0p1"
      sol_dir: "sol_dir_opt_0p1"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

    idw:
      name: "idw"
      label: "IDW"
      sol_dir: "sol_dir_idw"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

    ildw:
      name: "ildw"
      label: "ILDW"
      sol_dir: "sol_dir_ildw"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

data:
  gt_key_preference: ["R_gt", "rain", "gt"]
  allow_shape_mismatch: false

rain:
  threshold_mmph: 0.6

coverage:
  enabled: true
  bins: [0, 1, 2, 3, 4, "5+"]

distance:
  # Distance-to-3rd-closest-link bins (meters)
  bin_edges_m: [125, 375, 750, 1500, 3125, 6000, 9000, 12000]
  # max_candidates: 64
  method: sampled_points
  sample_spacing_m: 250.0
  k_query_samples: 48
  chunk_size: 8000
  max_samples_per_link: 200

plots:
  # Only final aggregate plots (IQR-of-medians), no per-patch plots
  skip_patch_plots: true
  
  bin_spacing: 1.35

  # Vertical scaling behavior
  automatic_vertical_scaling: true
  # If you set automatic_vertical_scaling: false, you must set:
  # vertical_scale: 0.35

output:
  out_dir: "batch_analyze_output_multi"
  images_subdir: "images"
  excel_filename: "stats_multi.xlsx"