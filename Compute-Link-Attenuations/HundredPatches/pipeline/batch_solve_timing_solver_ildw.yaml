# Solver(ILDW) runtime benchmark: same numerical settings as batch_solve_config.yaml.
# Separate reconstructions preserve the existing comparison results.
# Sequential patches avoid benchmark contention; resume skips completed timed patches.
# Records end-to-end wall time; this solver does not expose optimizer-only time.
# All paths are relative to this YAML file.

input:
  est_dir: ../est_dir
  file_pattern: est_input_*.json
  recursive: false
parallel:
  solver_workers: 1
  patch_workers: 1
timing:
  enabled: true
  out_dir: timing/solver_ildw
  file_prefix: solver_ildw
  resume: true
solvers:
  opt_norm_ildw_mult_ildw_init_light_jtotal_long:
    name: opt_norm_ildw_mult_ildw_init_light_jtotal_long
    label: Solver(ILDW)
    type: lbfgsb
    module: cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers
    out_dir: solutions/sol_dir_solver_ildw_timing
    optimization:
      epsilon: 0.01
      maxiter: 2000
      rain_init:
        mode: fixed
        value: 0.6
      R0_from_ILDW: true
      R0_from_IDW: false
      R0_from_GT: false
      num_atten: 1.0
      num_1d: 1.0
      num_2d: 0.5
      num_total: 1.0
      num_total_divide_by_num_pixels: true
    tolerances:
      ftol: 1.0e-06
      gtol: 1.0e-06
      maxls: 20
    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0
