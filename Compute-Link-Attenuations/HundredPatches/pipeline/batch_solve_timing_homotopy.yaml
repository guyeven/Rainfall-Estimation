# Homotopy runtime benchmark: same numerical settings as batch_solve_homotopy.yaml.
# Separate reconstructions preserve the existing comparison results.
# Sequential patches avoid benchmark contention; resume skips completed timed patches.
# Records end-to-end wall time; this solver does not expose optimizer-only time.
# All paths are relative to this YAML file.

input:
  est_dir: ../est_dir
  file_pattern: est_input_*.json
  recursive: false
parallel:
  solver_workers: 1
  patch_workers: 1
timing:
  enabled: true
  out_dir: timing/homotopy
  file_prefix: homotopy
  resume: true
solvers:
  opt_norm_virtual_homotopy_const_init_long_light_jtotal:
    name: opt_norm_virtual_homotopy_const_init_long_light_jtotal
    label: Homotopy Solver
    type: lbfgsb
    module: cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers_virtual_homotopy
    out_dir: solutions/sol_dir_homotopy_timing
    optimization:
      epsilon: 0.01
      maxiter: 2000
      beta_delta: 0.1
      rain_init:
        mode: fixed
        value: 0.6
        multiplier: 2.0
      R0_from_ILDW: false
      R0_from_IDW: false
      R0: 0.6
      num_atten: 1.0
      num_1d: 1.0
      num_2d: 0.5
      num_total: 1.0
      num_total_divide_by_num_pixels: true
    tolerances:
      ftol: 1.0e-06
      gtol: 1.0e-06
      maxls: 20
    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0
