# Six-method comparison: IDW, ILDW, and light/no-shrinkage solver variants.
# Paths are relative to this YAML file; writes a separate analysis cache.

input:
  gt_dir: ../gt_dir
  gt_prefix: gt
  est_input_dir: ../est_dir
  solvers:
    idw:
      name: idw
      label: IDW
      sol_dir: solutions/sol_dir_idw
      sol_prefix: est
      sol_key_preference:
      - R_hat
    ildw:
      name: ildw
      label: ILDW
      sol_dir: solutions/sol_dir_ildw
      sol_prefix: est
      sol_key_preference:
      - R_hat
    opt_norm_ildw_mult_ildw_init_light_jtotal_long:
      name: opt_norm_ildw_mult_ildw_init_light_jtotal_long
      label: Solver(ILDW) light shrinkage
      module: cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers
      sol_dir: solutions/sol_dir_opt_norm_ildw_mult_ildw_init_light_jtotal_long
      sol_prefix: est
      sol_key_preference:
      - R_hat
    solver_ildw_no_shrinkage:
      name: solver_ildw_no_shrinkage
      label: Solver(ILDW) no shrinkage
      module: cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers
      sol_dir: solutions/sol_dir_solver_ildw_no_shrinkage
      sol_prefix: est
      sol_key_preference:
      - R_hat
    opt_norm_virtual_convex_const_init_long_light_jtotal:
      name: opt_norm_virtual_convex_const_init_long_light_jtotal
      label: Convex light shrinkage
      module: cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers_virtual_convex
      sol_dir: solutions/sol_dir_opt_norm_virtual_convex_const_init_long_light_jtotal
      sol_prefix: est
      sol_key_preference:
      - R_hat
    convex_no_shrinkage:
      name: convex_no_shrinkage
      label: Convex no shrinkage
      module: cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers_virtual_convex
      sol_dir: solutions/sol_dir_convex_no_shrinkage
      sol_prefix: est
      sol_key_preference:
      - R_hat
data:
  gt_key_preference:
  - R_gt
  - rain
  - gt
  allow_shape_mismatch: false
rain:
  threshold_mmph: 0.6
  fp_fn_threshold_sweep_mmph:
    start: 0.2
    stop: 5.0
    step: 0.1
coverage:
  enabled: true
  bins:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5+
distance:
  bin_edges_m:
  - 125
  - 375
  - 750
  - 1500
  - 3125
  - 6000
  - 9000
  k_values:
  - 1
  - 2
  - 3
  method: sampled_points
  sample_spacing_m: 250.0
  k_query_samples: 100
  chunk_size: 8000
  max_samples_per_link: 200
jatten_link_distance:
  bin_edges_m:
  - 125
  - 375
  - 750
  - 1500
  - 3125
  - 6000
  - 9000
  k_values:
  - 2
  - 3
plots:
  skip_patch_plots: false
  enable_rae_histograms: false
  bin_spacing: 1.35
  automatic_vertical_scaling: true
  prune_bins_enabled: true
  prune_bins_zero_frac: 0.5
output:
  out_dir: batch_analyze_output_shrinkage_comparison
  images_subdir: images
  excel_filename: stats.xlsx
rae_hist:
  enabled: false
  bins: 50
  out_dir: images/RAE_histograms
