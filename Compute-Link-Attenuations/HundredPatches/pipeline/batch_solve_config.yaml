input:
  est_dir: "../est_dir"
  file_pattern: "est_input_*.json"
  recursive: false

parallel:
  solver_workers: 1
  patch_workers: 2

solvers:
  idw:
    name: "idw"
    label: "IDW"
    type: "idw"
    module: "cml_attenuation.idw_baseline"
    out_dir: "solutions/sol_dir_idw"
    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  ildw:
    name: "ildw"
    label: "ILDW"
    type: "idw"
    module: "cml_attenuation.ildw_baseline"
    out_dir: "solutions/sol_dir_ildw"
    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  opt_norm_ildw_mult_ildw_init_light_jtotal_long:
    name: "opt_norm_ildw_mult_ildw_init_light_jtotal_long"
    label: "OPT_NORM_ILDW_MULT_ILDW_INIT_LIGHT_JTOTAL_LONG"
    type: "lbfgsb"
    module: "cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers"
    out_dir: "solutions/sol_dir_opt_norm_ildw_mult_ildw_init_light_jtotal_long"
    optimization:
      epsilon: 0.01
      maxiter: 2000
      rain_init:
        mode: fixed
        value: 0.6
      R0_from_ILDW: true
      R0_from_IDW: false
      R0_from_GT: false
      num_atten: 1.0
      num_1d: 1.0
      num_2d: 0.5
      num_total: 1.0
      num_total_divide_by_num_pixels: true
    tolerances:
      ftol: 1.0e-06
      gtol: 1.0e-06
      maxls: 20
    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  opt_norm_virtual_convex_const_init_long_light_jtotal:
    name: "opt_norm_virtual_convex_const_init_long_light_jtotal"
    label: "OPT_NORM_VIRTUAL_CONVEX_CONST_INIT_LONG_LIGHT_JTOTAL"
    type: "lbfgsb"
    module: "cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers_virtual_convex"
    out_dir: "solutions/sol_dir_opt_norm_virtual_convex_const_init_long_light_jtotal"
    optimization:
      epsilon: 0.01
      maxiter: 2000
      rain_init:
        mode: fixed
        value: 0.6
        multiplier: 2.0
      R0_from_ILDW: false
      R0_from_IDW: false
      R0: 0.6
      num_atten: 1.0
      num_1d: 1.0
      num_2d: 0.5
      num_total: 1.0
      num_total_divide_by_num_pixels: true
    tolerances:
      ftol: 1.0e-06
      gtol: 1.0e-06
      maxls: 20
    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  opt_norm_virtual_homotopy_const_init_long_light_jtotal:
    name: "opt_norm_virtual_homotopy_const_init_long_light_jtotal"
    label: "OPT_NORM_VIRTUAL_HOMOTOPY_CONST_INIT_LONG_LIGHT_JTOTAL"
    type: "lbfgsb"
    module: "cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers_virtual_homotopy"
    out_dir: "solutions/sol_dir_opt_norm_virtual_homotopy_const_init_long_light_jtotal"
    optimization:
      epsilon: 0.01
      maxiter: 2000
      beta_delta: 0.1
      rain_init:
        mode: fixed
        value: 0.6
        multiplier: 2.0
      R0_from_ILDW: false
      R0_from_IDW: false
      R0: 0.6
      num_atten: 1.0
      num_1d: 1.0
      num_2d: 0.5
      num_total: 1.0
      num_total_divide_by_num_pixels: true
    tolerances:
      ftol: 1.0e-06
      gtol: 1.0e-06
      maxls: 20
    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  opt_norm_ildw_mult_gt_init_light_jtotal:
    name: "opt_norm_ildw_mult_gt_init_light_jtotal"
    label: "OPT_NORM_ILDW_MULT_GT_INIT_LIGHT_JTOTAL"
    type: "lbfgsb"
    module: "cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers"
    out_dir: "solutions/sol_dir_opt_norm_ildw_mult_gt_init_light_jtotal"
    optimization:
      epsilon: 0.01
      maxiter: 2000
      rain_init:
        mode: fixed
        value: 0.6
        gt:
          dir: "../gt_dir"
          prefix: "gt"
          key_preference: ["R_gt", "rain", "gt"]
      R0_from_GT: true
      R0_from_ILDW: false
      R0_from_IDW: false
      num_atten: 1.0
      num_1d: 1.0
      num_2d: 0.5
      num_total: 1.0
      num_total_divide_by_num_pixels: true
    tolerances:
      ftol: 1.0e-06
      gtol: 1.0e-06
      maxls: 20
    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0
