excel:
  enabled: true
output:
  images_subdir: images
  excel_filename: stats.xlsx
labels:
  solver_overrides:
    IDW: IDW
    ILDW: ILDW
    OPT_NORM_ILDW_MULT_ILDW_INIT_LIGHT_JTOTAL_LONG: Solver(ILDW)
    OPT_NORM_ILDW_MULT_GT_INIT_LIGHT_JTOTAL: Solver(GT)
    OPT_NORM_VIRTUAL_CONVEX_CONST_INIT_LONG_LIGHT_JTOTAL: Convex Solver
    OPT_NORM_VIRTUAL_HOMOTOPY_CONST_INIT_LONG_LIGHT_JTOTAL: Homotopy Solver
    Roy DCT (nonlinear adaptation): Roy DCT (limited)
style:
  dpi: 150
  bin_spacing: 1.35
  prune_bins_enabled: true
  prune_bins_zero_frac: 0.5
plots:
  largest_patch_distance_bins: false
  patch_overview: false
  j_behavior: false
  patch_error_maps: false
  patch_error_maps_include_map: false
  old_patch_error_maps: false
  rae_histograms: false
  fp_fn_vs_threshold: true
  distance_profiles: true
  distance_profiles_relative: false
  p90_profiles: false
  jatten_profiles: true
  jatten_profiles_relative: false
  link_ratio_summary: false
  gt_binned_patchavg: false
  patch_map_metrics: true
filters:
  k_values:
  - 3
  jatten_k_values:
  - 3
