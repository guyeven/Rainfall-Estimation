input:
  est_dir: "est_dir"
  file_pattern: "est_input_*.json"
  recursive: false

solvers:
  opt_idw:
    name: "opt_idw"
    label: "OPT_IDW"
    type: "lbfgsb"
    module: "solve_rain_lbfgsb"
    out_dir: "sol_dir_opt_idw"

    optimization:
      lambda: 0.01
      mu: 1.0e-06
      epsilon: 0.01
      R0: 0.6
      maxiter: 300
      R0_from_IDW: true

    tolerances:
      ftol: 1.0e-05
      gtol: 1.0e-04
      maxls: 20

    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  opt_ildw:
    name: "opt_ildw"
    label: "OPT_ILDW"
    type: "lbfgsb"
    module: "solve_rain_lbfgsb"
    out_dir: "sol_dir_opt_ildw"

    optimization:
      lambda: 0.01
      mu: 1.0e-06
      epsilon: 0.01
      R0: 0.6
      maxiter: 300
      R0_from_ILDW: true      # <— new
      R0_from_IDW: false      # (optional, but keeps intent clear)

    tolerances:
      ftol: 1.0e-05
      gtol: 1.0e-04
      maxls: 20

    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  opt_0p6:
    name: "opt_0p6"
    label: "OPT_0p6"
    type: "lbfgsb"
    module: "solve_rain_lbfgsb"
    out_dir: "sol_dir_opt_0p6"

    optimization:
      lambda: 0.01
      mu: 1.0e-06
      epsilon: 0.01
      R0: 0.6
      maxiter: 300
      R0_from_IDW: false

    tolerances:
      ftol: 1.0e-05
      gtol: 1.0e-04
      maxls: 20

  opt_j2_0p6:
    name: "opt_j2_0p6"
    label: "OPT_J2"
    type: "lbfgsb"
    module: "solve_rain_lbfgsb_j2"
    out_dir: "sol_dir_opt_j2_0p6"

    optimization:
      lambda: 0.01
      mu: 1.0e-06
      epsilon: 0.01
      R0: 0.6
      maxiter: 300
      R0_from_IDW: false

    tolerances:
      ftol: 1.0e-05
      gtol: 1.0e-04
      maxls: 20

    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  opt_j3_0p6:
    name: "opt_j3_0p6"
    label: "OPT_J3"
    type: "lbfgsb"
    module: "solve_rain_lbfgsb_j3"
    out_dir: "sol_dir_opt_j3_0p6"

    optimization:
      lambda: 0.01
      mu: 1.0e-06
      epsilon: 0.01
      R0: 0.6
      maxiter: 300
      R0_from_IDW: false

    tolerances:
      ftol: 1.0e-05
      gtol: 1.0e-04
      maxls: 20

    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  opt_j2_j3_0p6:
    name: "opt_j2_j3_0p6"
    label: "OPT_J2_J3"
    type: "lbfgsb"
    module: "solve_rain_lbfgsb_j2_j3"
    out_dir: "sol_dir_opt_j2_j3_0p6"

    optimization:
      lambda: 0.01
      mu: 1.0e-06
      epsilon: 0.01
      R0: 0.6
      maxiter: 300
      R0_from_IDW: false

    tolerances:
      ftol: 1.0e-05
      gtol: 1.0e-04
      maxls: 20

    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  hybrid_a:
    name: "hybrid_a"
    label: "HYBRID_A"
    type: "custom"
    module: "solve_rain_hybrid"
    out_dir: "sol_dir_hybrid_a"

    hybrid:
      base_solver: "OPT_0p6"
      threshold_mmph: 0.6

      distance:
        k: 3
        bin_edges_m: [125, 375, 750, 1500, 3125, 6000, 9000]
        method: sampled_points
        sample_spacing_m: 250.0
        k_query_samples: 100
        chunk_size: 8000
        max_samples_per_link: 200

      bin_solver_map:
        "≤125": "OPT_IDW"
        "(125,375]": "OPT_IDW"
        "(375,750]": "OPT_IDW"
        "(750,1500]": "OPT_IDW"
        "(1500,3125]": "OPT_IDW"
        "(3125,6000]": "OPT_IDW"
        "(6000,9000]": "OPT_ILDW"
        ">9000": "OPT_0p6"

      default_solver: "OPT_IDW"

      solver_outputs:
        OPT_IDW: "sol_dir_opt_idw"
        OPT_ILDW: "sol_dir_opt_ildw"
        OPT_0p6: "sol_dir_opt_0p6"

  idw:
    name: "idw"
    label: "IDW"
    type: "idw"
    module: "idw_baseline"
    out_dir: "sol_dir_idw"

    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0

  ildw:
    name: "ildw"
    label: "ILDW"
    type: "ildw"
    module: "ildw_baseline"
    out_dir: "sol_dir_ildw"

    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0
