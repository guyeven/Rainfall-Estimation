excel:
  enabled: true

output:
  images_subdir: "images"
  excel_filename: "stats_multi_new_solver.xlsx"

style:
  dpi: 150
  bin_spacing: 1.35
  prune_bins_enabled: true
  prune_bins_zero_frac: 0.5

plots:
  largest_patch_distance_bins: true
  j_behavior: true
  patch_error_maps: true
  rae_histograms: true
  fp_fn_vs_threshold: true
  distance_profiles: true
  distance_profiles_relative: true
  p90_profiles: true
  jatten_profiles: true
  jatten_profiles_relative: true
  link_ratio_summary: true
  gt_binned_patchavg: true

filters:
  k_values: [2, 3]
  jatten_k_values: [2, 3]
