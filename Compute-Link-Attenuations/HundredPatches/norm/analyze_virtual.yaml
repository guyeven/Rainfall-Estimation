# ============================================================
# analyze_virtual.yaml (DICT-style solvers; paths relative to this YAML)
# ============================================================

input:
  gt_dir: "../gt_dir"
  gt_prefix: "gt"

  est_input_dir: "../est_dir"

  solvers:
    idw:
      name: "idw"
      label: "IDW"
      sol_dir: "sol_dir_idw"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

    ildw:
      name: "ildw"
      label: "ILDW"
      sol_dir: "sol_dir_ildw"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

    opt_norm_ildw_mult_ildw_init:
      name: "opt_norm_ildw_mult_ildw_init"
      label: "OPT_NORM_ILDW_MULT_ILDW_INIT"
      module: "solve_rain_lbfgsb_normalized_ildw_multipliers"
      sol_dir: "sol_dir_opt_norm_ildw_mult_ildw_init"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

    opt_norm_virtual_convex_ildw_init:
      name: "opt_norm_virtual_convex_ildw_init"
      label: "OPT_NORM_VIRTUAL_CONVEX_ILDW_INIT"
      module: "solve_rain_lbfgsb_normalized_ildw_multipliers_virtual_convex"
      sol_dir: "sol_dir_opt_norm_virtual_convex_ildw_init"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

    opt_norm_virtual_convex_const_init:
      name: "opt_norm_virtual_convex_const_init"
      label: "OPT_NORM_VIRTUAL_CONVEX_CONST_INIT"
      module: "solve_rain_lbfgsb_normalized_ildw_multipliers_virtual_convex"
      sol_dir: "sol_dir_opt_norm_virtual_convex_const_init"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

    opt_norm_virtual_homotopy:
      name: "opt_norm_virtual_homotopy"
      label: "OPT_NORM_VIRTUAL_HOMOTOPY"
      module: "solve_rain_lbfgsb_normalized_ildw_multipliers_virtual_homotopy"
      sol_dir: "sol_dir_opt_norm_virtual_homotopy"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]

data:
  gt_key_preference: ["R_gt", "rain", "gt"]
  allow_shape_mismatch: false

rain:
  threshold_mmph: 0.6
  fp_fn_threshold_sweep_mmph:
    start: 0.2
    stop: 5.0
    step: 0.1

coverage:
  enabled: true
  bins: [0, 1, 2, 3, 4, "5+"]

distance:
  bin_edges_m: [125, 375, 750, 1500, 3125, 6000, 9000]
  k_values: [1, 2, 3]
  method: sampled_points
  sample_spacing_m: 250.0
  k_query_samples: 100
  chunk_size: 8000
  max_samples_per_link: 200

jatten_link_distance:
  bin_edges_m: [125, 375, 750, 1500, 3125, 6000, 9000]
  k_values: [2, 3]

plots:
  skip_patch_plots: false
  enable_rae_histograms: false
  bin_spacing: 1.35
  automatic_vertical_scaling: true
  prune_bins_enabled: true
  prune_bins_zero_frac: 0.5

output:
  out_dir: "batch_analyze_virtual_output"
  images_subdir: "images"
  excel_filename: "stats_multi_new_solver.xlsx"

rae_hist:
  enabled: false
  bins: 50
  out_dir: "images/RAE_histograms"
