# June 2023 analysis of all batch-solved methods except Roy DCT.
input:
  gt_dir: "../gt_dir"
  gt_prefix: "gt"
  est_input_dir: "../est_dir"
  solvers:
    idw:
      name: "idw"
      label: "IDW"
      sol_dir: "solutions/sol_dir_idw"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]
    ildw:
      name: "ildw"
      label: "ILDW"
      sol_dir: "solutions/sol_dir_ildw"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]
    solver_ildw_timing:
      name: "solver_ildw_timing"
      label: "Solver(ILDW) light shrinkage"
      sol_dir: "solutions/sol_dir_solver_ildw_timing"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]
    solver_ildw_no_shrinkage:
      name: "solver_ildw_no_shrinkage"
      label: "Solver(ILDW) no shrinkage"
      sol_dir: "solutions/sol_dir_solver_ildw_no_shrinkage"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]
    convex_light_shrinkage:
      name: "convex_light_shrinkage"
      label: "Convex Solver light shrinkage"
      sol_dir: "solutions/sol_dir_convex_light_shrinkage"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]
    convex_no_shrinkage:
      name: "convex_no_shrinkage"
      label: "Convex Solver no shrinkage"
      sol_dir: "solutions/sol_dir_convex_no_shrinkage"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]
    homotopy_light_shrinkage:
      name: "homotopy_light_shrinkage"
      label: "Homotopy Solver light shrinkage"
      sol_dir: "solutions/sol_dir_homotopy_light_shrinkage"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]
    homotopy_no_shrinkage:
      name: "homotopy_no_shrinkage"
      label: "Homotopy Solver no shrinkage"
      sol_dir: "solutions/sol_dir_homotopy_no_shrinkage"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]
    roy_dct_ildw_outer50:
      name: "roy_dct_ildw_outer50"
      label: "ILDW-init Roy DCT"
      module: "cml_attenuation.solvers.solve_rain_roy_dct"
      sol_dir: "solutions/sol_dir_roy_dct_ildw_outer50"
      sol_prefix: "est"
      sol_key_preference: ["R_hat"]
data:
  gt_key_preference: ["R_gt", "rain", "gt"]
  allow_shape_mismatch: false
rain:
  threshold_mmph: 0.6
  fp_fn_threshold_sweep_mmph: {start: 0.2, stop: 5.0, step: 0.1}
coverage:
  enabled: true
  bins: [0, 1, 2, 3, 4, "5+"]
distance:
  bin_edges_m: [125, 375, 750, 1500, 3125, 6000, 9000]
  k_values: [1, 2, 3]
  method: sampled_points
  sample_spacing_m: 250.0
  k_query_samples: 100
  chunk_size: 8000
  max_samples_per_link: 200
jatten_link_distance:
  bin_edges_m: [125, 375, 750, 1500, 3125, 6000, 9000]
  k_values: [2, 3]
plots:
  skip_patch_plots: false
  enable_rae_histograms: false
  bin_spacing: 1.35
  automatic_vertical_scaling: true
  prune_bins_enabled: true
  prune_bins_zero_frac: 0.5
output:
  out_dir: "batch_analyze_output_june_full"
  images_subdir: "images"
  excel_filename: "stats.xlsx"
rae_hist:
  enabled: false
  bins: 50
  out_dir: "images/RAE_histograms"
