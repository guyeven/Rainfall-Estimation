# June 2023 report selection.
# Box-and-whisker views are the preferred distribution plots; Taylor diagrams
# are rendered by render_analysis_report.py by default.
excel:
  enabled: true

output:
  images_subdir: "images"
  excel_filename: "stats.xlsx"

style:
  dpi: 150
  bin_spacing: 1.35
  prune_bins_enabled: true
  prune_bins_zero_frac: 0.5

plots:
  largest_patch_distance_bins: false
  patch_overview: true
  j_behavior: true
  patch_error_maps: false
  old_patch_error_maps: false
  rae_histograms: false
  fp_fn_vs_threshold: true
  distance_profiles: true
  distance_profiles_relative: true
  p90_profiles: true
  jatten_profiles: true
  jatten_profiles_relative: true
  link_ratio_summary: true
  gt_binned_patchavg: true

filters:
  k_values: [3]
  jatten_k_values: [3]
