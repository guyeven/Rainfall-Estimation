# batch_solve_config.yaml
#
# Directory-based batch config for: batch_solve_rain_lbfgsb.py
#
# This config tells the batch runner:
#   1) where to FIND estimator-input JSON files (input.est_dir)
#   2) where to WRITE one solver output .npz per input file (output.out_dir)
#   3) which optimization parameters to use (optimization.*)
#   4) which L-BFGS-B tolerances to use (tolerances.*)
#
# How to run:
#   python batch_solve_rain_lbfgsb.py --config batch_solve_config.yaml
#
# Notes:
# - The batch runner will print to stdout which file is currently being solved.
# - Outputs are named: <out_dir>/<input_stem>_solution.npz
#   Example:
#     input : est_input_foo.json
#     output: est_input_foo_solution.npz
#
# - This config is "directory batch" mode. It does NOT use the `runs:` list.

# ----------------------------
# Input: estimator JSON directory
# ----------------------------
input:
  # Directory containing estimator input JSON files.
  # Each JSON is expected to be compatible with solve_rain_lbfgsb.py's loader.
  #  est_dir: "/ABS/PATH/TO/est_inputs/"
  est_dir: "/Users/guyeven/Library/CloudStorage/Nextcloud-guyeven@nextcloud.mpi-klsb.mpg.de/RainfallMap/Compute-Link-Attenuations/Testing-Main" 

  # File pattern (glob) for selecting estimator inputs within est_dir.
  # Typical values:
  #   - "est_input_*.json"  (recommended; matches the project naming convention)
  #   - "*.json"            (if your folder contains only estimator JSONs)
  file_pattern: "est_input_*.json"

  # If true, search est_dir recursively (including subfolders).
  # You can also override at runtime by passing: --recursive
  recursive: false

# ----------------------------
# Output: directory for solutions
# ----------------------------
output:
  # Directory where one .npz per input file will be written.
  # The script will create this directory if it doesn't exist.
  out_dir: "/Users/guyeven/Library/CloudStorage/Nextcloud-guyeven@nextcloud.mpi-klsb.mpg.de/RainfallMap/Compute-Link-Attenuations/Testing-Main" 

  # If true, the solver may print certain warnings (e.g., about degenerate links).
  # This is forwarded into solve_rain_lbfgsb.py's solve_lbfgsb_and_save(...).
  warn: true

# ----------------------------
# Optimization parameters (same meaning as in solve_rain_lbfgsb.py)
# ----------------------------
optimization:
  # Smoothness regularization weight (lambda).
  # Larger values => smoother rainfall fields (more spatial smoothing).
  # Smaller values => closer fit to observations (less smoothing).
  lambda: 1.0e-2

  # Shrinkage / sparsity weight (mu).
  # Larger values => pushes rainfall toward 0 more strongly.
  # Smaller values => allows more non-zero rainfall.
  mu: 1.0e-6

  # Epsilon used inside log(R + epsilon) to avoid log(0).
  # Typical: 0.01
  epsilon: 0.01

  # Initial rainfall value for the solver initialization (mm/h).
  # 0.0 is common if you expect many zeros.
  R0: 0.1

  # Max number of L-BFGS-B iterations.
  # Higher can improve convergence but costs more time.
  maxiter: 300

# ----------------------------
# L-BFGS-B tolerances (SciPy minimize)
# ----------------------------
tolerances:
  # ftol: function-value tolerance for termination.
  # Smaller => stricter convergence.
  ftol: 1.0e-5

  # gtol: projected gradient tolerance for termination.
  # Smaller => stricter convergence.
  gtol: 1.0e-4

  # maxls: max line-search steps per iteration.
  maxls: 20
