<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
  <rect width="1600" height="1220" fill="#fff"/>
  <image href="specific-attenuation-background.png" x="0" y="0" width="1600" height="1067"/>
  <!-- I-beam dimension marker identifies the illustrative one-kilometre segment. -->
  <line x1="565" y1="299" x2="565" y2="335" stroke="#b45309" stroke-width="6"/>
  <line x1="565" y1="317" x2="1035" y2="317" stroke="#b45309" stroke-width="6"/>
  <line x1="1035" y1="299" x2="1035" y2="335" stroke="#b45309" stroke-width="6"/>
  <rect x="714" y="340" width="172" height="44" rx="15" fill="#fff" fill-opacity="0.97" stroke="#d97706" stroke-width="2"/>
  <text x="800" y="370" text-anchor="middle" fill="#7c2d12" font-family="Arial, sans-serif" font-size="22" font-weight="700">length = 1 km</text>
  <!-- Endpoint cards show position first, then power and its units. -->
  <rect x="376" y="396" width="260" height="82" rx="14" fill="#fff" fill-opacity="0.97" stroke="#d97706" stroke-width="2"/>
  <text x="506" y="427" text-anchor="middle" fill="#102c54" font-family="Arial, sans-serif" font-size="21" font-weight="700">s: position</text>
  <text x="506" y="460" text-anchor="middle" fill="#26364d" font-family="Arial, sans-serif" font-size="18">Power(s) (measured in watts)</text>
  <line x1="590" y1="478" x2="565" y2="494" stroke="#b45309" stroke-width="4"/>
  <circle cx="565" cy="494" r="9" fill="#b45309" stroke="#fff" stroke-width="4"/>
  <rect x="990" y="396" width="340" height="82" rx="14" fill="#fff" fill-opacity="0.97" stroke="#d97706" stroke-width="2"/>
  <text x="1160" y="427" text-anchor="middle" fill="#102c54" font-family="Arial, sans-serif" font-size="21" font-weight="700">s + length</text>
  <text x="1160" y="460" text-anchor="middle" fill="#26364d" font-family="Arial, sans-serif" font-size="18">Power(s + length) (measured in watts)</text>
  <line x1="1030" y1="478" x2="1035" y2="494" stroke="#b45309" stroke-width="4"/>
  <circle cx="1035" cy="494" r="9" fill="#b45309" stroke="#fff" stroke-width="4"/>
  <!-- Specific-attenuation calculation placed at the lower edge of the rain field. -->
  <rect x="150" y="812" width="1300" height="202" rx="22" fill="#fff" fill-opacity="0.93" stroke="#d8e1ec" stroke-width="2"/>
  <image href="02-specific-attenuation-equation.png" x="300" y="830" width="1000" height="166"/>
</svg>
