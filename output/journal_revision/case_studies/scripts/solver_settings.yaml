# Solver settings for the two case studies. Copied from Compute-Link-Attenuations/HundredPatches/pipeline/
# batch_solve_solver_gt_no_shrinkage.yaml and batch_solve_no_shrinkage.yaml (branch oct26).
# rerun_solvers.py fills in input.est_dir, the ground-truth directory and absolute out_dir paths.
parallel:
  solver_workers: 1
  patch_workers: 1
solvers:
  solver_gt_no_shrinkage:
    name: solver_gt_no_shrinkage
    label: Solver(GT) no shrinkage
    type: lbfgsb
    module: cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers
    out_dir: solutions/sol_dir_solver_gt_no_shrinkage
    optimization:
      epsilon: 0.01
      maxiter: 2000
      rain_init:
        mode: fixed
        value: 0.6
        gt:
          dir: null  # set by rerun_solvers.py
          prefix: gt
          key_preference: [R_gt, rain, gt]
      R0_from_GT: true
      R0_from_ILDW: false
      R0_from_IDW: false
      num_atten: 1.0
      num_1d: 1.0
      num_2d: 0.5
      num_total: 0.0
      num_total_divide_by_num_pixels: true
    tolerances:
      ftol: 1.0e-06
      gtol: 1.0e-06
      maxls: 20
    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0
  convex_no_shrinkage:
    name: "convex_no_shrinkage"
    label: "Convex Solver without shrinkage"
    type: "lbfgsb"
    module: "cml_attenuation.solvers.solve_rain_lbfgsb_normalized_ildw_multipliers_virtual_convex"
    out_dir: "solutions/sol_dir_convex_no_shrinkage"
    optimization:
      epsilon: 0.01
      maxiter: 2000
      rain_init:
        mode: fixed
        value: 0.6
        multiplier: 2.0
      R0_from_ILDW: false
      R0_from_IDW: false
      R0: 0.6
      num_atten: 1.0
      num_1d: 1.0
      num_2d: 0.5
      num_total: 0.0
      num_total_divide_by_num_pixels: true
    tolerances:
      ftol: 1.0e-06
      gtol: 1.0e-06
      maxls: 20
    idw:
      r_max_m: 15000.0
      power: 2.0
      eps_m: 1.0
      default_value: 0.0
